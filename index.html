<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>PixelPad</title>
<link rel="icon" href="pixelpad-icon.svg" type="image/svg+xml">
<link rel="icon" href="pixelpad-icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="pixelpad-icon-180.png">
<style>
:root{--bg:#e9edf2;--panel:#fff;--line:#d6dce4;--text:#1d2733;--muted:#687585;--accent:#2563eb;--accent-soft:#dbe7fd;--hover:#f1f4f8;--stage:#cfd6df}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{flex:none;height:52px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:17px;margin:0 6px 0 2px;white-space:nowrap}
.brand span{color:var(--accent)}
.fname{width:170px;max-width:28vw;border:1px solid transparent;border-radius:8px;padding:7px 9px;font:inherit;background:var(--hover);color:var(--text)}
.fname:focus{outline:none;border-color:var(--accent);background:#fff}
.spacer{flex:1}
.ib{height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;border:0;border-radius:10px;background:transparent;cursor:pointer;white-space:nowrap}
.ib:hover{background:var(--hover)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px;flex:none}
.zoomlbl{min-width:58px;font-variant-numeric:tabular-nums;color:var(--muted)}
#opts{flex:none;display:flex;align-items:center;gap:10px;padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;min-height:58px}
.grp{display:flex;align-items:center;gap:8px;flex:none}
.lbl{font-size:12px;color:var(--muted)}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:4px 5px;border-radius:10px;cursor:pointer}
.slot i{width:34px;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.22);display:block}
.slot span{font-size:10px;color:var(--muted)}
.slot.active{background:var(--accent-soft)}
.slot.active span{color:var(--accent);font-weight:600}
.palette{display:grid;grid-template-columns:repeat(10,21px);gap:3px}
.sw{width:21px;height:21px;border-radius:5px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.custom{position:relative;width:34px;height:34px;border-radius:10px;overflow:hidden;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);flex:none}
.custom input{position:absolute;inset:-4px;opacity:0;width:calc(100% + 8px);height:calc(100% + 8px);cursor:pointer}
input[type=range]{width:120px;accent-color:var(--accent)}
.val{min-width:28px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--hover);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 11px;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.14);color:var(--accent)}
main{flex:1;display:flex;min-height:0}
#tools{flex:none;width:62px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;overflow-y:auto}
#tools .ib{width:46px;height:46px}
.hsep{width:32px;height:1px;background:var(--line);margin:4px 0;flex:none}
#stage{flex:1;overflow:auto;background:var(--stage);-webkit-overflow-scrolling:touch}
#inner{min-width:100%;min-height:100%;width:max-content;height:max-content;display:flex;align-items:center;justify-content:center;padding:28px}
#wrap{position:relative;box-shadow:0 2px 14px rgba(0,0,0,.2);background:#fff;flex:none}
#wrap canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{touch-action:none;cursor:crosshair}
#scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#drawer{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:86vw;background:var(--panel);z-index:21;transform:translateX(-105%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.15)}
body.menu #scrim{opacity:1;pointer-events:auto}
body.menu #drawer{transform:none}
.dhead{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line)}
.ditems{padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.ditem{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:transparent;border-radius:10px;text-align:left;cursor:pointer}
.ditem:hover{background:var(--hover)}
.dsec{font-size:11px;color:var(--muted);padding:14px 12px 4px;text-transform:uppercase;letter-spacing:.05em}
.dfoot{margin-top:auto;padding:12px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;z-index:30}
.modal.open{display:flex}
.card{background:var(--panel);border-radius:14px;padding:18px;width:340px;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.card h3{margin:0 0 12px;font-size:17px}
.row{display:flex;gap:10px;margin-bottom:12px}
.row label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.row input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;color:var(--text);width:100%}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--hover);border-radius:999px;padding:6px 11px;cursor:pointer;font-size:12px}
.actions{display:flex;justify-content:flex-end;gap:8px}
.btn{border:0;border-radius:10px;padding:9px 15px;cursor:pointer;background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#1d2733;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:40;font-size:13px}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <button class="ib" id="menuBtn" data-icon="menu" title="Menü" aria-label="Menü"></button>
  <div class="brand">Pixel<span>Pad</span></div>
  <input class="fname" id="fname" value="bild" spellcheck="false" autocomplete="off" title="Dateiname">
  <div class="spacer"></div>
  <button class="ib" id="undoBtn" data-icon="undo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig"></button>
  <button class="ib" id="redoBtn" data-icon="redo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen"></button>
  <div class="sep"></div>
  <button class="ib" id="zoomOut" data-icon="zoomOut" title="Verkleinern" aria-label="Verkleinern"></button>
  <button class="ib zoomlbl" id="zoomLbl" title="Einpassen">100%</button>
  <button class="ib" id="zoomIn" data-icon="zoomIn" title="Vergrößern" aria-label="Vergrößern"></button>
  <div class="sep"></div>
  <button class="ib" id="saveBtn" data-icon="save" title="Als PNG speichern (Strg+S)" aria-label="Speichern"></button>
</header>

<div id="opts">
  <div class="grp">
    <button class="slot active" data-slot="0" title="Farbe 1: Stift, Rand, Text, Farbeimer, Sprühdose"><i></i><span>Stift</span></button>
    <button class="slot" data-slot="1" title="Farbe 2: Fläche von Rechteck und Ellipse"><i></i><span>Fläche</span></button>
  </div>
  <div class="grp"><div class="palette" id="palette"></div><label class="custom" title="Eigene Farbe"><input type="color" id="picker"></label></div>
  <div class="sep"></div>
  <div class="grp" id="gSize"><span class="lbl">Stärke</span><input type="range" id="size" min="1" max="60" value="4"><span class="val" id="sizeVal">4</span></div>
  <div class="grp" id="gFont"><span class="lbl">Schriftgröße</span><input type="range" id="font" min="8" max="200" value="32"><span class="val" id="fontVal">32</span></div>
  <div class="grp" id="gMode"><span class="lbl">Form</span><div class="seg" id="mode"><button data-m="stroke" class="on">Rand</button><button data-m="fill">Fläche</button><button data-m="both">Beides</button></div></div>
</div>

<main>
  <nav id="tools"></nav>
  <div id="stage"><div id="inner"><div id="wrap"><canvas id="cv"></canvas><canvas id="ov"></canvas></div></div></div>
</main>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dhead"><button class="ib" data-act="close" data-icon="close" aria-label="Schließen"></button><div class="brand">Pixel<span>Pad</span></div></div>
  <div class="ditems">
    <div class="dsec">Datei</div>
    <button class="ditem" data-act="new" data-icon="new">Neues Bild …</button>
    <button class="ditem" data-act="open" data-icon="open">Öffnen …</button>
    <button class="ditem" data-act="png" data-icon="save">Speichern als PNG</button>
    <button class="ditem" data-act="jpg" data-icon="image">Speichern als JPG</button>
    <div class="dsec">Bearbeiten</div>
    <button class="ditem" data-act="undo" data-icon="undo">Rückgängig</button>
    <button class="ditem" data-act="redo" data-icon="redo">Wiederholen</button>
    <button class="ditem" data-act="clear" data-icon="clear">Leinwand leeren</button>
  </div>
  <div class="dfoot">Deine Zeichnung wird automatisch im Browser zwischengespeichert. Zum dauerhaften Sichern bitte „Speichern“ verwenden – die Datei landet in „Dateien → Downloads“.</div>
</aside>

<div class="modal" id="newModal">
  <div class="card">
    <h3>Neues Bild</h3>
    <div class="row"><label>Breite (Pixel)<input type="number" id="nw" min="1" max="4000" value="800"></label><label>Höhe (Pixel)<input type="number" id="nh" min="1" max="4000" value="600"></label></div>
    <div class="presets">
      <button class="chip" data-w="800" data-h="600">800 × 600</button>
      <button class="chip" data-w="1024" data-h="768">1024 × 768</button>
      <button class="chip" data-w="1280" data-h="720">1280 × 720</button>
      <button class="chip" data-w="64" data-h="64">64 × 64 (Pixel-Art)</button>
      <button class="chip" data-w="32" data-h="32">32 × 32 (Icon)</button>
    </div>
    <div class="actions"><button class="btn" id="newCancel">Abbrechen</button><button class="btn primary" id="newOk">Erstellen</button></div>
  </div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div id="toast"></div>

<script>
(()=>{
const ICONS={
menu:'M4 6h16M4 12h16M4 18h16',close:'M6 6l12 12M18 6 6 18',
undo:'M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11',redo:'M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13',
zoomIn:'M11 4a7 7 0 1 0 0 14 7 7 0 1 0 0-14zM20 20l-4-4M11 8v6M8 11h6',zoomOut:'M11 4a7 7 0 1 0 0 14 7 7 0 1 0 0-14zM20 20l-4-4M8 11h6',
save:'M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6',open:'M3 6h6l2 2h10v11H3z',new:'M6 3h8l5 5v13H6zM14 3v5h5',
image:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15.5 9h.01',clear:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
pen:'M4 20l1.5-5L16 4.5l3.5 3.5L9 18.5zM14 6.5l3.5 3.5',eraser:'M9 20h11M4.5 15.5 14 6l5 5-8.5 8.5H8.5zM9.5 10.5l5 5',
spray:'M6 11h7v10H6zM8 11V8h3v3M16 5h.01M19 7h.01M16 9h.01M19 11h.01M21 4h.01',
fill:'M4 12 11 5l7 7-7 7zM4 12h14M20 15s1.5 2 1.5 3a1.5 1.5 0 0 1-3 0c0-1 1.5-3 1.5-3z',
picker:'M16 4l4 4-2.5 2.5-4-4zM14.5 8.5 6 17v3h3l8.5-8.5',text:'M5 7V4h14v3M12 4v16M9 20h6',
line:'M5 19 19 5',rect:'M4 6h16v12H4z',ellipse:'M12 6c4.4 0 8 2.7 8 6s-3.6 6-8 6-8-2.7-8-6 3.6-6 8-6z',
hand:'M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V5a1.5 1.5 0 0 1 3 0v6M14 11V6.5a1.5 1.5 0 0 1 3 0V14c0 3.5-2.5 6-6 6-2.4 0-4-1.3-5.3-3.5L4 13.5a1.4 1.4 0 0 1 2.3-1.6L8 14'
};
const $=s=>document.querySelector(s);
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
document.querySelectorAll('[data-icon]').forEach(el=>el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon)));

const cv=$('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const ov=$('#ov'),octx=ov.getContext('2d');
const wrap=$('#wrap'),stage=$('#stage'),fname=$('#fname'),nav=$('#tools');
const PALETTE=['#000000','#7f7f7f','#880015','#ed1c24','#ff7f27','#fff200','#22b14c','#00a2e8','#3f48cc','#a349a4',
               '#ffffff','#c3c3c3','#b97a57','#ffaec9','#ffc90e','#efe4b0','#b5e61d','#99d9ea','#7092be','#c8bfe7'];
const TOOLS=[['pen','Stift'],['eraser','Radierer'],['spray','Sprühdose'],['fill','Farbeimer'],['picker','Pipette'],null,
             ['line','Linie'],['rect','Rechteck'],['ellipse','Ellipse'],['text','Text'],null,['hand','Ansicht verschieben']];
const S={W:800,H:600,zoom:1,tool:'pen',prevTool:'pen',size:4,font:32,mode:'stroke',colors:['#000000','#ffffff'],active:0,dirty:false};
let undoStack=[],redoStack=[];

/* ---------- Leinwand & Zoom ---------- */
function setCanvasSize(w,h){S.W=cv.width=ov.width=w;S.H=cv.height=ov.height=h;applyZoom();}
function clearWhite(){ctx.save();ctx.fillStyle='#ffffff';ctx.fillRect(0,0,S.W,S.H);ctx.restore();}
function applyZoom(){wrap.style.width=S.W*S.zoom+'px';wrap.style.height=S.H*S.zoom+'px';$('#zoomLbl').textContent=Math.round(S.zoom*100)+'%';}
const ZL=[.1,.25,.33,.5,.67,.75,1,1.5,2,3,4,6,8,12,16];
function setZoom(z){
  const cx=(stage.scrollLeft+stage.clientWidth/2)/stage.scrollWidth,cy=(stage.scrollTop+stage.clientHeight/2)/stage.scrollHeight;
  S.zoom=z;applyZoom();
  stage.scrollLeft=cx*stage.scrollWidth-stage.clientWidth/2;stage.scrollTop=cy*stage.scrollHeight-stage.clientHeight/2;
}
function zoomStep(d){
  let i=ZL.findIndex(z=>z>=S.zoom-1e-6);if(i<0)i=ZL.length-1;
  if(d>0)i=ZL[i]>S.zoom+1e-6?i:i+1;else i=i-1;
  setZoom(ZL[Math.max(0,Math.min(ZL.length-1,i))]);
}
function fit(){const z=Math.min((stage.clientWidth-56)/S.W,(stage.clientHeight-56)/S.H);S.zoom=Math.max(.05,Math.min(z,8));applyZoom();}

/* ---------- Rückgängig ---------- */
const snap=()=>({w:S.W,h:S.H,img:ctx.getImageData(0,0,S.W,S.H)});
function pushUndo(){undoStack.push(snap());if(undoStack.length>25)undoStack.shift();redoStack=[];updUndo();}
function restore(s){if(s.w!==S.W||s.h!==S.H){setCanvasSize(s.w,s.h);fit();}ctx.putImageData(s.img,0,0);}
function undo(){if(!undoStack.length)return;redoStack.push(snap());restore(undoStack.pop());changed();}
function redo(){if(!redoStack.length)return;undoStack.push(snap());restore(redoStack.pop());changed();}
function updUndo(){$('#undoBtn').disabled=!undoStack.length;$('#redoBtn').disabled=!redoStack.length;}
function changed(){S.dirty=true;updUndo();scheduleAutosave();}

/* ---------- Zeichenfunktionen ---------- */
const penColor=()=>S.tool==='eraser'?'#ffffff':S.colors[0];
function line(c,a,b,col,sz){
  c.fillStyle=col;c.strokeStyle=col;
  if(sz<=2){ // pixelgenau (Bresenham)
    let x0=Math.floor(a.x),y0=Math.floor(a.y);const x1=Math.floor(b.x),y1=Math.floor(b.y);
    const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,o=Math.floor(sz/2);let err=dx+dy;
    for(;;){c.fillRect(x0-o,y0-o,sz,sz);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx;}if(e2<=dx){err+=dx;y0+=sy;}}
    return;
  }
  c.lineWidth=sz;c.lineCap='round';c.lineJoin='round';
  if(a.x===b.x&&a.y===b.y){c.beginPath();c.arc(a.x,a.y,sz/2,0,Math.PI*2);c.fill();return;}
  c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();
}
function shape(c,a,b){
  const sz=S.size;
  if(S.tool==='line'){line(c,a,b,S.colors[0],sz);return;}
  const x0=Math.round(Math.min(a.x,b.x)),y0=Math.round(Math.min(a.y,b.y)),x1=Math.round(Math.max(a.x,b.x)),y1=Math.round(Math.max(a.y,b.y));
  const w=x1-x0,h=y1-y0;if(w<1&&h<1)return;
  const doFill=S.mode!=='stroke',doStroke=S.mode!=='fill';
  c.fillStyle=S.colors[1];c.strokeStyle=S.colors[0];c.lineWidth=sz;c.lineJoin='miter';
  if(S.tool==='rect'){
    if(doFill)c.fillRect(x0,y0,w,h);
    if(doStroke){if(w<=sz||h<=sz){c.fillStyle=S.colors[0];c.fillRect(x0,y0,w,h);}else c.strokeRect(x0+sz/2,y0+sz/2,w-sz,h-sz);}
  }else{
    c.beginPath();c.ellipse((x0+x1)/2,(y0+y1)/2,Math.max(.5,(w-(doStroke?sz:0))/2),Math.max(.5,(h-(doStroke?sz:0))/2),0,0,Math.PI*2);
    if(doFill)c.fill();if(doStroke)c.stroke();
  }
}
function spray(){
  if(!drag)return;const p=drag.last,r=Math.max(4,S.size*2.5),n=Math.round(r*1.2);
  ctx.fillStyle=S.colors[0];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,d=Math.sqrt(Math.random())*r;ctx.fillRect(Math.floor(p.x+Math.cos(a)*d),Math.floor(p.y+Math.sin(a)*d),1,1);}
}
function hexToRgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
const rgbHex=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
function floodFill(x,y,hex){
  const W=S.W,H=S.H;if(x<0||y<0||x>=W||y>=H)return false;
  const img=ctx.getImageData(0,0,W,H),d=img.data,[r,g,b]=hexToRgb(hex);
  const i0=(y*W+x)*4,tr=d[i0],tg=d[i0+1],tb=d[i0+2],ta=d[i0+3];
  if(tr===r&&tg===g&&tb===b&&ta===255)return false;
  const tol=40,seen=new Uint8Array(W*H);
  const match=k=>{const i=k*4;return Math.abs(d[i]-tr)<=tol&&Math.abs(d[i+1]-tg)<=tol&&Math.abs(d[i+2]-tb)<=tol&&Math.abs(d[i+3]-ta)<=tol;};
  const st=[x,y];
  while(st.length){
    const cy=st.pop(),cx=st.pop();let lx=cx;
    while(lx>=0&&!seen[cy*W+lx]&&match(cy*W+lx))lx--;lx++;
    let up=false,down=false;
    for(let px=lx;px<W;px++){
      const k=cy*W+px;if(seen[k]||!match(k))break;
      seen[k]=1;const i=k*4;d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255;
      if(cy>0){const m=!seen[k-W]&&match(k-W);if(m&&!up){st.push(px,cy-1);up=true;}else if(!m)up=false;}
      if(cy<H-1){const m=!seen[k+W]&&match(k+W);if(m&&!down){st.push(px,cy+1);down=true;}else if(!m)down=false;}
    }
  }
  ctx.putImageData(img,0,0);return true;
}
function pick(p){
  const d=ctx.getImageData(Math.min(S.W-1,Math.floor(p.x)),Math.min(S.H-1,Math.floor(p.y)),1,1).data;
  setColor(S.active,rgbHex(d[0],d[1],d[2]));setTool(S.prevTool);toast('Farbe übernommen');
}
function addText(p){
  const t=prompt('Text eingeben:');if(!t)return;
  pushUndo();ctx.fillStyle=S.colors[0];ctx.font=`${S.font}px -apple-system,"Segoe UI",Roboto,Arial,sans-serif`;ctx.textBaseline='top';
  ctx.fillText(t,Math.round(p.x),Math.round(p.y));changed();
}

/* ---------- Eingabe (Maus, Finger, Stift) ---------- */
let drag=null,sprayT=null;
function pos(e){const r=ov.getBoundingClientRect();return{x:(e.clientX-r.left)*S.W/r.width,y:(e.clientY-r.top)*S.H/r.height};}
ov.addEventListener('pointerdown',e=>{
  if(drag||(e.pointerType==='mouse'&&e.button!==0))return;
  e.preventDefault();const p=pos(e);
  if(S.tool==='picker'){pick(p);return;}
  if(S.tool==='fill'){const before=snap();if(floodFill(Math.floor(p.x),Math.floor(p.y),S.colors[0])){undoStack.push(before);if(undoStack.length>25)undoStack.shift();redoStack=[];changed();}return;}
  if(S.tool==='text'){addText(p);return;}
  try{ov.setPointerCapture(e.pointerId);}catch(_){}
  drag={id:e.pointerId,start:p,last:p,sx:e.clientX,sy:e.clientY,sl:stage.scrollLeft,st:stage.scrollTop};
  if(S.tool==='hand'){ov.style.cursor='grabbing';return;}
  pushUndo();
  if(S.tool==='pen'||S.tool==='eraser')line(ctx,p,p,penColor(),S.size);
  if(S.tool==='spray'){spray();sprayT=setInterval(spray,30);}
});
ov.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;e.preventDefault();
  if(S.tool==='hand'){stage.scrollLeft=drag.sl-(e.clientX-drag.sx);stage.scrollTop=drag.st-(e.clientY-drag.sy);return;}
  if(S.tool==='pen'||S.tool==='eraser'){
    const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
    for(const ce of (evs.length?evs:[e])){const p=pos(ce);line(ctx,drag.last,p,penColor(),S.size);drag.last=p;}
    return;
  }
  drag.last=pos(e);
  if(S.tool==='spray')return;
  octx.clearRect(0,0,S.W,S.H);shape(octx,drag.start,drag.last);
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;const t=S.tool;
  if(t==='spray'){clearInterval(sprayT);sprayT=null;}
  if(t==='line'||t==='rect'||t==='ellipse'){octx.clearRect(0,0,S.W,S.H);shape(ctx,drag.start,drag.last);}
  drag=null;
  if(t==='hand')ov.style.cursor='grab';else changed();
}
ov.addEventListener('pointerup',endDrag);ov.addEventListener('pointercancel',endDrag);
stage.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();zoomStep(e.deltaY<0?1:-1);}},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- Werkzeuge & Farben ---------- */
TOOLS.forEach(t=>{
  if(!t){nav.insertAdjacentHTML('beforeend','<div class="hsep"></div>');return;}
  const b=document.createElement('button');b.className='ib';b.dataset.tool=t[0];b.title=t[1];b.setAttribute('aria-label',t[1]);b.innerHTML=icon(t[0]);
  b.onclick=()=>setTool(t[0]);nav.append(b);
});
function setTool(t){
  if(t==='picker'&&S.tool!=='picker')S.prevTool=S.tool;
  S.tool=t;nav.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  $('#gSize').style.display=['pen','eraser','spray','line','rect','ellipse'].includes(t)?'':'none';
  $('#gFont').style.display=t==='text'?'':'none';
  $('#gMode').style.display=['rect','ellipse'].includes(t)?'':'none';
  ov.style.cursor=t==='hand'?'grab':'crosshair';
}
const pal=$('#palette');
PALETTE.forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.title=c;b.setAttribute('aria-label','Farbe '+c);b.onclick=()=>setColor(S.active,c);pal.append(b);});
function updColors(){document.querySelectorAll('.slot').forEach(b=>{const i=+b.dataset.slot;b.classList.toggle('active',i===S.active);b.querySelector('i').style.background=S.colors[i];});$('#picker').value=S.colors[S.active];}
function setColor(i,c){S.colors[i]=c;updColors();}
document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{S.active=+b.dataset.slot;updColors();});
$('#picker').addEventListener('input',e=>setColor(S.active,e.target.value));
$('#size').addEventListener('input',e=>{S.size=+e.target.value;$('#sizeVal').textContent=S.size;});
$('#font').addEventListener('input',e=>{S.font=+e.target.value;$('#fontVal').textContent=S.font;});
$('#mode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.mode=b.dataset.m;$('#mode').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});

/* ---------- Dateien ---------- */
function dataURLtoBlob(u){const[h,b]=u.split(',');const mime=h.match(/:(.*?);/)[1];const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime});}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function baseName(){return(fname.value.trim()||'bild').replace(/\.(png|jpe?g)$/i,'').replace(/[\\/:*?"<>|]/g,'_');}
function save(fmt){
  const name=baseName()+'.'+fmt;
  const url=fmt==='jpg'?cv.toDataURL('image/jpeg',.92):cv.toDataURL('image/png');
  download(dataURLtoBlob(url),name);S.dirty=false;closeMenu();toast('Gespeichert: '+name);
}
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{pushUndo();setCanvasSize(img.naturalWidth,img.naturalHeight);clearWhite();ctx.drawImage(img,0,0);URL.revokeObjectURL(url);
    fname.value=f.name.replace(/\.[^.]+$/,'');fit();changed();S.dirty=false;toast('Geöffnet: '+f.name);};
  img.onerror=()=>toast('Diese Datei kann nicht geöffnet werden.');
  img.src=url;
});
let asT;
function scheduleAutosave(){clearTimeout(asT);asT=setTimeout(()=>{try{localStorage.setItem('pixelpad.autosave',JSON.stringify({name:fname.value,data:cv.toDataURL('image/png')}));}catch(_){}} ,800);}
function restoreAutosave(){
  let s=null;try{s=JSON.parse(localStorage.getItem('pixelpad.autosave')||'null');}catch(_){}
  if(!s||!s.data)return false;
  const img=new Image();img.onload=()=>{setCanvasSize(img.naturalWidth,img.naturalHeight);clearWhite();ctx.drawImage(img,0,0);fit();};img.src=s.data;
  if(s.name)fname.value=s.name;return true;
}
fname.addEventListener('change',scheduleAutosave);
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue='';}});

/* ---------- Menü & Dialoge ---------- */
const openMenu=()=>document.body.classList.add('menu'),closeMenu=()=>document.body.classList.remove('menu');
$('#menuBtn').onclick=openMenu;$('#scrim').onclick=closeMenu;
$('#drawer').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='close')closeMenu();
  if(a==='new'){closeMenu();$('#nw').value=S.W;$('#nh').value=S.H;$('#newModal').classList.add('open');}
  if(a==='open'){closeMenu();$('#file').click();}
  if(a==='png'||a==='jpg')save(a);
  if(a==='undo')undo();if(a==='redo')redo();
  if(a==='clear'){pushUndo();clearWhite();changed();closeMenu();}
});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{$('#nw').value=c.dataset.w;$('#nh').value=c.dataset.h;});
$('#newCancel').onclick=()=>$('#newModal').classList.remove('open');
$('#newOk').onclick=()=>{
  const w=Math.max(1,Math.min(4000,parseInt($('#nw').value)||800)),h=Math.max(1,Math.min(4000,parseInt($('#nh').value)||600));
  pushUndo();setCanvasSize(w,h);clearWhite();fit();fname.value='bild';changed();S.dirty=false;$('#newModal').classList.remove('open');
};
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
$('#zoomIn').onclick=()=>zoomStep(1);$('#zoomOut').onclick=()=>zoomStep(-1);$('#zoomLbl').onclick=fit;
$('#saveBtn').onclick=()=>save('png');
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2200);}
document.addEventListener('keydown',e=>{
  const m=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(m&&k==='s'){e.preventDefault();save('png');return;}
  if(m&&k==='o'){e.preventDefault();$('#file').click();return;}
  if(e.target.matches('input[type=text],input[type=number],input:not([type])'))return;
  if(m&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(m&&k==='y'){e.preventDefault();redo();}
  else if(k==='escape'){closeMenu();$('#newModal').classList.remove('open');}
});

/* ---------- Start ---------- */
setCanvasSize(800,600);clearWhite();
if(!restoreAutosave())fit();
setTool('pen');updColors();updUndo();
})();
</script>
</body>
</html>
